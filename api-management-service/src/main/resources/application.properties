spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies


spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=root
spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.open-in-view=false

spring.flyway.enabled=true
# spring.flyway.locations=classpath/migration


# Flyway migration logging
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

# Disable the open-in-view warning
spring.jpa.open-in-view=false